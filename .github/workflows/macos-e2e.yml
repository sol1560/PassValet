name: macOS application tests

on:
  push:
    branches: [amp/complete-passvalet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/release-script.test.mjs
      - name: Verify editor installation with real Codex CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-install-test" --no-audit --no-fund @openai/codex@0.154.0
          PASSVALET_TEST_CODEX_BIN="$RUNNER_TEMP/codex-install-test/node_modules/.bin" node --test tests/install-script.test.mjs
      - run: pnpm exec tsx --test tests/extension-safety.test.mjs
      - run: pnpm typecheck
      - run: pnpm --filter @passvalet/desktop build
      - run: pnpm build:extension
      - name: Build CLI sidecar
        run: |
          cargo build --locked -p passvalet-cli
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/passvalet "apps/desktop/src-tauri/binaries/passvalet-$(rustc -vV | sed -n 's/^host: //p')"
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Rust formatting and strict checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build real desktop with test driver
        env:
          VITE_PASSVALET_E2E: '1'
        run: pnpm --filter @passvalet/desktop tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
      - name: Real WKWebView and MCP tests
        run: bash scripts/test-desktop.sh
      - name: Test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7

  release-package:
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-package
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Build release app, CLI, dmg and extension
        run: bash scripts/build-release.sh
      - name: Verify unpacked release and reject test commands
        run: |
          out=test-results/packages
          mkdir -p "$out"
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/PassValet.app "$out/PassValet.app.zip"
          cp target/release/bundle/dmg/*.dmg "$out/"
          cp apps/extension/.output/*chrome*.zip "$out/"
          cp target/release/passvalet LICENSE "$out/"
          for zip in "$out/"*.zip; do unzip -t "$zip"; done
          for dmg in "$out/"*.dmg; do hdiutil verify "$dmg"; done
          unpacked="$(mktemp -d /tmp/passvalet-package.XXXXXX)"
          trap 'rm -rf "$unpacked"' EXIT
          ditto -x -k "$out/PassValet.app.zip" "$unpacked"
          node tests/release-app.mjs "$unpacked/PassValet.app"
          (cd "$out" && shasum -a 256 *.zip *.dmg passvalet LICENSE > SHA256SUMS)
      - name: Unsigned test packages, not a published release
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-test-packages-${{ runner.arch }}
          path: test-results/packages/*
          if-no-files-found: error
          retention-days: 7
      - name: Release startup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-screenshot-${{ runner.arch }}
          path: test-results/release-startup.png
          if-no-files-found: ignore
          retention-days: 7
