[workspace]
resolver = "2"
members = [
  "crates/passvalet-core",
  "crates/passvalet-ipc",
  "crates/passvalet-agent",
  "crates/passvalet-cli",
  "crates/tauri-plugin-macos-passkey",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/passvalet/passvalet"

[workspace.dependencies]
passvalet-core = { path = "crates/passvalet-core" }
passvalet-ipc = { path = "crates/passvalet-ipc" }
passvalet-agent = { path = "crates/passvalet-agent" }
tauri-plugin-macos-passkey = { path = "crates/tauri-plugin-macos-passkey" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
regex = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
schemars = { version = "1", features = ["chrono04"] }
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "uuid-impl"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
